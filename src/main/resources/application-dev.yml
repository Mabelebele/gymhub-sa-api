# Local development profile: in-memory H2 database, SQL logging on,
# H2 web console enabled, and a fixed (non-production) JWT secret so the
# app runs out of the box with `./mvnw spring-boot:run`.
spring:
  datasource:
    url: jdbc:h2:mem:gymhubsa;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-dev-only-secret-key-change-me}
  cors:
    # Includes common Expo web-preview ports (varies 8081-8084 depending on what's free)
    # alongside the Angular dev server, so both web clients can reach the API locally.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084}

logging:
  level:
    org.hibernate.SQL: DEBUG
