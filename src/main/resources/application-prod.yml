# Production profile: PostgreSQL via environment variables (set these on
# Render or wherever the app is deployed). JWT secret MUST be provided via
# the JWT_SECRET env var — there is no default for production.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: WARN
    za.co.gymhubsa.api: INFO
